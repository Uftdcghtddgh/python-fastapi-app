name: CI

on: [push, pull_request]

env:
  APP_NAME: fastapi-starter

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Verifier le style
        run: ruff check .

  build:
    name: Build - Verifier l'application
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer l'application
        run: python -c "from app.main import app; print(app.title)"

      - name: Afficher les informations de contexte (Q8, Q10)
        run: |
          echo "Nom de l'application : ${{ env.APP_NAME }}"
          echo "Acteur : ${{ github.actor }}"
          echo "Nom de l'événement : ${{ github.event_name }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "SHA du commit : ${{ github.sha }}"
          echo "OS du runner : ${{ runner.os }}"
          echo '${{ toJson(github) }}'

  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Executer les tests
        run: pytest
